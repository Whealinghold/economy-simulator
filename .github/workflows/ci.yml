# Thin on purpose: triggers, runners, the `full` condition and one script call per job.
# The logic lives in scripts/ci/ (plan-2-ci D5) and runs the same on a developer machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Per ref; only PR runs are cancelled by a newer push, never main or the nightly. The nightly and
# the label event get their own groups so neither cancels, nor is dropped for, an ordinary run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  check:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: scripts/ci/check.sh

  arm64:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: scripts/ci/arm64.sh

  full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - run: scripts/ci/full.sh
      # Kept before the upload to Codacy, so a flake there never loses a multi-hour run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            coverage.out
            otelobserver/coverage.out
          if-no-files-found: warn
      # Only code of this repository sees the token: never a fork's pull request (plan-2-ci D7).
      - run: scripts/ci/codacy-upload.sh coverage.out otelobserver/coverage.out
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_COMMIT_UUID: ${{ github.event.pull_request.head.sha || github.sha }}
