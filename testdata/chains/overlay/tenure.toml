# The tenure module on the refill endowment of overlay/resources.toml (spec-land.md 15.1,
# spec-reference-chain.md 4.5). It adds titles to the arable land of north, a region of pack
# one and of pack five, and a posted rent. It does not name any other region, so it loads on
# both. Layer it after the pack and after the resources overlay: base.toml, one.toml,
# warm-one.toml, overlay/resources.toml, this file (or five.toml and warm-five.toml).
#
# The numbers are placeholders (N-015, N-027), not a calibration. Each grower household holds
# 20 basis points of the stock: 253 households of pack one hold 5 060 of 10 000, 414 of pack
# five hold 8 280, and the pool of north holds 1 000 more, so the sum stays below 10 000 on
# both. The plan stock of the arable land is half its capacity (plan_share_bp 5000), so one
# title is above one unit on both packs. The rent per let unit is 2 and does not move
# (rent_step_bp is 0): a datum, not a controller (spec-land.md 10.1).
#
# The pack has no estates module, so the pool's title raises the warning rent_hoarded: rent
# paid to the pool is not released as relief (spec-land.md 11.2). That is the only warning of
# the module on this overlay.

[modules.tenure]

[modules.tenure.term.north.arable]
rent = 2

[modules.tenure.holding.north.arable.grower]
share_bp = 20

[modules.tenure.holding.north.arable.pool]
share_bp = 1000
