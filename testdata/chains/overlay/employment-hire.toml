# The employment module in its hire form on the pack one-demand (spec-employment.md 3 to 17, 13, plan 3-emp).
# Layer it after the pack: base.toml, demand.toml, one-demand.toml, warm-one-demand.toml, this file. It replaces
# overlay/employment.toml (the payroll form): the two forms never run together (24.3.2).
# A test double, not a design: every number is a placeholder (N-015, N-027). The cooks are the employers and
# post their own recipes as the hire list; the diggers and the foresters, the unskilled roles that work at a
# raw recipe, are the Hireable ones. Every other role works for itself, as in the pack. The census and the warm
# start are those of the pack: this overlay adds the module, not the recipes. The values of the block are the
# defaults of the form, written out so that a reader sees them; max_open is the module's own default.

[modules.employment]
hire = true
max_open = 1000

[role.cook.employer]
recipes = [ "prepare", "prepare_basic" ]
max_hires = 4
worker_share_bp = 5000
hire_yield_bp = 10000

[role.digger]
hireable = true
[role.forester]
hireable = true
