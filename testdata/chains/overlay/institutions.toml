# The institutions module alone on the warm five (spec-institutions.md 13.5, spec-reference-chain.md 4.5, plan 3-org
# Phase 10). A body over the one skilled role of the hub region, with places at 80 % of the region's starting
# households of that role, a produce right and a train right, and two price controls on the staple keyed by the two
# child jurisdictions of overlay/polity.toml. Every number is a placeholder (N-015, N-027): the cap and the floor are
# chosen above the cost floor of the chain so that no market freezes (spec 6.5.5), and the probe test of the golden
# (TestGolden_InstitutionsExercisesTheModule) fails if the pack does not exercise the module.
# The skilled role is the cook: training_ticks is core data (spec-config.md 3.7.2) and a role with it needs groups of
# scale 1; the centre holds 218 cooks, so 80 % is 174 places and 44 cooks start outside the body.
# Layer it after the pack and the polity overlay: base.toml, lines.toml, five.toml, warm-five.toml,
# overlay/polity.toml, this file.

[role.cook]
training_ticks = 120
max_trainees = 3
teaching_load = 1000

[modules.institutions]

[modules.institutions.body.guild]
roles = [ "cook" ]
regions = [ "centre" ]
places = 174
max_trainees = 2
label = "the cooks' guild"

[modules.institutions.right.prepare]
body = "guild"
activity = "produce"
subject = "prepare"
region = "centre"

[modules.institutions.right.teach]
body = "guild"
activity = "train"
subject = "cook"
region = "centre"

# The assize of group_a: a cap at 90 % of the staple's reference price. Group_b has a floor only.
[modules.institutions.control.assize_a]
commodity = "staple"
jurisdiction = "group_a"
cap_bp = 9000

[modules.institutions.control.assize_b]
commodity = "staple"
jurisdiction = "group_b"
floor_bp = 11000
