# The insurance module on the stores of pack one (plan 3-ins phase 8, spec-insurance.md 4, 14, spec-reference-chain.md 4.5):
# the grower is an insured of its barn, the cook an underwriter. Layer it after the pack, overlay/storage.toml (the barn),
# overlay/risk-store.toml (the store row it reads) and overlay/credit.toml (a payout the underwriter cannot pay in full is a
# claim): base.toml, one.toml, warm-one.toml, overlay/storage.toml, overlay/risk-store.toml, overlay/credit.toml, this file.
# No transport is needed: with min_loss_bp 0 the grower asks for no route cover (spec-insurance.md 4.1.1). A test double,
# not a design: every number is a placeholder (N-015, N-027).
#
# The module: as in overlay/cover.toml. The grower covers all the goods its barn holds (store_share_bp 10 000), at a store
# rate of up to 500 of 10 000 a tick (max_store_rate_bp) and a cover of at least half of the sum (min_cover_bp). The cook
# underwrites at a store rate of 10 of 10 000 a tick (store_rate_bp: a higher rate leaves the growers too poor for the
# premium, so that most of them are uncovered when a strike comes), a cover of 8 000 and all its free capacity (share_bp
# 10 000, cap_bp 100 000, the bound). A strike takes goods from a few barns in 400 ticks (the pack collapses, N-352), so the
# golden holds only a few payouts.

[modules.insurance]
value_cap_bp = 20000
payout_ticks = 1
min_sum = 1
max_policies = 1000
max_cover_requests = 4

[role.grower.cover.insure]
min_loss_bp = 0
ruin_share_bp = 0
max_loading_bp = 20000
min_cover_bp = 5000
store_share_bp = 10000
max_store_rate_bp = 500

[role.cook.cover.underwrite]
loading_bp = 10000
store_rate_bp = 10
cover_bp = 8000
cap_bp = 100000
share_bp = 10000
