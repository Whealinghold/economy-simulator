# The external-sector overlay of the variant three (spec-external-sector.md 18.2; spec-reference-chain.md 4.5, 7.9; plan 2-16 D538, S71). Layer it last: base.toml, three.toml, overlay/trade-three.toml, overlay/transport-three.toml, overlay/information-three.toml, overlay/merchants-three.toml, this file. It attaches an outside node `outer` to `far_south` by an edge each way: the outside sells the raw input `fuel` and buys the staple there, so a consignment toward the node is refused (`outside_destination`). A test double, not a design: every number is a placeholder (N-015, N-027).
[region.outer]
[region.far_south.edge.outer]
distance = 100
[region.outer.edge.far_south]
distance = 100

