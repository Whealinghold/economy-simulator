# The bands of the migration scenario S61 on pack two (spec-reference-chain.md 7.1.5;
# plan 2-14 Phase 8). The key is unset: a key with no `value` line makes the test report
# its measure and assert nothing on it. A value is set by a reviewed run (STY 8.4), with
# a `set_by = "commit=<id>;config=<hash>;seeds=<a>-<b>"` line (FR-REF-024).

# S61: the most journeys started over the minimum that the net change of households of
# the shocked region needs, in thousandths (1000 is no more than the minimum).
[s61.journeys_factor]
unit = "ratio"
# X1: the most gap of a lane after the warm-up, as a share of the delivered price (STY-P06).
[x1.margin_bp]
unit = "bp"
# X1: the most gap of the worst lane, as a share of the delivered price (STY-P06).
[x1.worst_bp]
unit = "bp"
# X1: the ticks before the margin is read (STY-P06).
[x1.warmup]
unit = "ticks"
# D01: the most share of household-ticks unfed (STY-D01).
[d01.unfed_bp]
unit = "bp"
# H02: the most absolute offset of a market from the warm table (STY-H02).
[h02.offset_bp]
unit = "bp"
# H02: the most gap of the money of the households from its start (STY-H02).
[h02.money_bp]
unit = "bp"
# X4(e) and G01: the least households at any tick as a share of the start (STY-G01).
[x4.households_bp]
unit = "bp"
