# The bands of scenario S14 on pack famine (spec-reference-chain.md 7.1.5). Every
# key is unset: a key with no `value` line makes the test report its measure and
# assert nothing on it. A value is set by a reviewed run (STY 8.4), with a
# `set_by = "commit=<id>;config=<hash>;seeds=<a>-<b>"` line (FR-REF-024).

# S14: the households return to within this band of the pre-shock level (basis points).
[s14.recover_band_bp]
unit = "bp"
# S14: the most ticks after the shock until the households are back in the band.
[s14.recover_ticks]
unit = "ticks"
# S14: the most households may fall, as a share of the start (basis points); also
# the switch of the ladder-order check.
[s14.fall_bp]
unit = "bp"
