# The bands of the facts on pack one with overlay/external.toml (scenario S51, STY-T03;
# spec-stylised-facts.md 5.6; plan 2-19 D597). A file of its own because the closed
# steady state is not the price when an outside quotes it (STY 5.9 C7): STY-P04's key
# is not declared beside these. Every key is unset: a key with no `value` line makes
# the test report its measure and assert nothing on it. A value is set by a reviewed
# run (STY 8.4), with a `set_by = "commit=<id>;config=<hash>;seeds=<a>-<b>"` line.

# T03: the share of a price within this of the outside quote (STY-T03, report).
[t03.quote_band_bp]
unit = "bp"
# T03: the pull of the quote below which N-113 is decided (STY-T03, report).
[t03.pull_bp]
unit = "bp"
