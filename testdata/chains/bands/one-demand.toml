# The bands of the demand scenarios on pack one-demand (spec-reference-chain.md
# 7.7, plan 2-5 D319). Every key is unset: a key with no `value` line makes the
# test report its measure and assert nothing on it. A value is set by a reviewed
# run (STY 8.4), with a `set_by = "commit=<id>;config=<hash>;seeds=<a>-<b>"` line
# (FR-REF-024).

# S23: the mean treat_a price of the last 100 ticks lies within this band of the
# reference price, from a start 10% above and 10% below (basis points).
[s23.band_bp]
unit = "bp"
# S25: the most swing, over a year, of the share of one alternative of the
# substituted want between the two items (basis points).
[s25.swing_bp]
unit = "bp"
# W01: the least mean welfare ratio of the households (STY-W01).
[w01.mean_low_bp]
unit = "bp"
# W01: the most mean welfare ratio of the households (STY-W01).
[w01.mean_high_bp]
unit = "bp"
# W02: households started above and below end within this of each other (STY-W02, tier L).
[w02.n_band_bp]
unit = "bp"
# W02: the end ratio lies within this of r* (STY-W02, tier L).
[w02.ratio_band_bp]
unit = "bp"
# W06: the realised net rate near the end level, per year (STY-W06, tier L).
[w06.fixed_point_bp]
unit = "bp"
# W06: a closed region stops within this below M / stake (STY-W06, tier L).
[w06.money_cap_bp]
unit = "bp"
# D01: the most share of household-ticks unfed (STY-D01).
[d01.unfed_bp]
unit = "bp"
# X4(e) and G01: the least households at any tick as a share of the start (STY-G01).
[x4.households_bp]
unit = "bp"
