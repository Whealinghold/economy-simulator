# The bands of the scenarios on pack one (spec-reference-chain.md 7.1.5). Every
# key is unset: a key with no `value` line makes the test report its measure and
# assert nothing on it. A value is set by a reviewed run (STY 8.4), with a
# `set_by = "commit=<id>;config=<hash>;seeds=<a>-<b>"` line (FR-REF-024).

# S01: the ten-tick mean price lies within this band of P0 (basis points).
[s01.band_bp]
unit = "bp"
# S01: the most ticks after the shock until the price is back in the band and stays.
[s01.recover_ticks]
unit = "ticks"
# S01: the most gap between the mean of the last 100 ticks and the seed price.
[s01.offset_bp]
unit = "bp"
# S01: the most share of household-ticks of the shock window that were unfed.
[s01.unmet_bp]
unit = "bp"
# S04: the longest run of ticks the staple price may sit at a bound.
[s04.pinned_ticks]
unit = "ticks"
# S04: the largest absolute measured demand elasticity of the staple.
[s04.elasticity_max_bp]
unit = "bp"
# S07: the longest freeze (no trade while both sides have unmatched orders).
[s07.freeze_ticks]
unit = "ticks"
# S07: the most share of prepared made that spoiled.
[s07.spoiled_bp]
unit = "bp"
# S16: the most share of ticks of the last year the staple price is at a bound.
[s16.pinned_share_bp]
unit = "bp"
# S19: the aggregate welfare ratio lies within this band of 10 000 (reported only
# in version 1: HouseholdIncome is not OK).
[s19.ratio_band_bp]
unit = "bp"
# S19: the most unsold stock of a produced good, as a share of the halt threshold.
[s19.stock_bound_bp]
unit = "bp"
# M05 (used by S19): the most share of money in the pool and escrow.
[m05.pool_share_bp]
unit = "bp"
# S10: the largest gap of a commodity's time-averaged price at scales 4 and 10 from
# its value at scale 1 (the placeholder is 1 000, spec-scale.md 7.2).
[s10.tolerance_bp]
unit = "bp"
# S10: the least time-averaged dispersion of belief centres of a market (the
# placeholder is 100, spec-scale.md 7.2).
[s10.dispersion_min_bp]
unit = "bp"
# S03: the longest run of ticks the staple price may sit at a bound (STY-P02).
[s03.pinned_ticks]
unit = "ticks"
# S05: the most High over Low of a price in a window, in ten-thousandths (STY-P03).
[s05.range_factor]
unit = "ratio"
# S05: the most a window range may grow over the previous one (STY-P03).
[s05.range_growth_bp]
unit = "bp"
# S06: the end share of the cooks lies within this band of the balanced one (STY-D03).
[s06.share_band_bp]
unit = "bp"
# S06: the most swing of a role share over the run (STY-D03).
[s06.swing_bp]
unit = "bp"
# S06: with the tool off the premium is within this of 10 000 (STY-W04).
[s06.free_tool_tol_bp]
unit = "bp"
# S08: the price of each series settles within this band of its earlier level (STY-P05).
[s08.band_bp]
unit = "bp"
# S08: the most ticks after the shock until every price has settled (STY-P05).
[s08.settle_ticks]
unit = "ticks"
# S12: the most High over Low of each calendar year after the first (STY-P03).
[s12.range_factor]
unit = "ratio"
# S17: the most ratio of the largest replacement-bid count of a tick to the mean (STY-H04).
[s17.spike_factor]
unit = "ratio"
# S17: the cold control exceeds the warm ratio by at least this (STY-H04).
[s17.control_gap_bp]
unit = "bp"
# S20: the most ticks until a net earner reaches the reserve (STY-M06, tier N).
[s20.ticks]
unit = "ticks"
# P07: the most drift of the price index link per year (STY-P07).
[p07.drift_bp]
unit = "bp"
# A1: the price stays within this band of its start over the first 30 ticks (STY-H01).
[a1.price_band_bp]
unit = "bp"
# D01: the most share of household-ticks unfed (STY-D01).
[d01.unfed_bp]
unit = "bp"
# H02: the most absolute offset of a market from the warm table (STY-H02).
[h02.offset_bp]
unit = "bp"
# H02: the most gap of the money of the households from its start (STY-H02).
[h02.money_bp]
unit = "bp"
# X4(e) and G01: the least households at any tick as a share of the start (STY-G01).
[x4.households_bp]
unit = "bp"
