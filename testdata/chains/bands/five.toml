# The bands of the scenarios and facts on pack five (spec-reference-chain.md 7.1.5;
# spec-stylised-facts.md 3.6, 5; plan 2-19 D597). Every key is unset: a key with no
# `value` line makes the test report its measure and assert nothing on it. A value
# is set by a reviewed run (STY 8.4), with a
# `set_by = "commit=<id>;config=<hash>;seeds=<a>-<b>"` line (FR-REF-024).

# D01: the most share of household-ticks unfed (STY-D01).
[d01.unfed_bp]
unit = "bp"
# H02: the most absolute offset of a market from the warm table (STY-H02).
[h02.offset_bp]
unit = "bp"
# H02: the most gap of the money of the households from its start (STY-H02).
[h02.money_bp]
unit = "bp"
# X4(e) and G01: the least households at any tick as a share of the start (STY-G01).
[x4.households_bp]
unit = "bp"
