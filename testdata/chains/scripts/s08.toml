# Scenario S08, spec-reference-chain.md 7.2 and 7.1.3: a cost shock to a raw input
# (STY-P05): dig_mineral at 5 000 bp from tick 400 to 519, in 700 ticks. Each [[shock]]
# is applied between steps, before the step of its tick. yield_bp 10000 clears the
# shock.
[[shock]]
tick = 400
region = "north"
recipe = "dig_mineral"
yield_bp = 5000
[[shock]]
tick = 520
region = "north"
recipe = "dig_mineral"
yield_bp = 10000
