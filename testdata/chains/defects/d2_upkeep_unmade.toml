# Defect 2: an upkeep good no region can make (rule unproducible_in_realm).
# base.toml marks fuel raw, and a raw good is sourced (spec-viability.md 4.2.1), so the overlay
# also takes the marker off; otherwise only labour_short would remain (the pooled programme is 0).
[commodity.fuel]
raw = false
[region.north.yield.cut_fuel]
all = 0
