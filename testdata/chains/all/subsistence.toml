# The subsistence module on the variant five (spec-subsistence.md 16; plan 2-24 D683): overlay/own-use.toml with the yield rows of its three sited source recipes in every region, since a sited recipe needs a row in each region where it runs (R4). A test double, not a design.
[recipe.own_staple]
duration = 1
sited = true
outputs = [ { commodity = "staple", quantity = 2, cost_share = 10000 } ]
[recipe.own_prepared]
duration = 1
sited = true
outputs = [ { commodity = "prepared", quantity = 1, cost_share = 10000 } ]
[recipe.own_fuel]
duration = 1
sited = true
outputs = [ { commodity = "fuel", quantity = 1, cost_share = 10000 } ]
[region.north.yield.own_staple]
all = 10000
[region.north.yield.own_prepared]
all = 10000
[region.north.yield.own_fuel]
all = 10000
[region.east.yield.own_staple]
all = 10000
[region.east.yield.own_prepared]
all = 10000
[region.east.yield.own_fuel]
all = 10000
[region.south.yield.own_staple]
all = 10000
[region.south.yield.own_prepared]
all = 10000
[region.south.yield.own_fuel]
all = 10000
[region.west.yield.own_staple]
all = 10000
[region.west.yield.own_prepared]
all = 10000
[region.west.yield.own_fuel]
all = 10000
[region.centre.yield.own_staple]
all = 10000
[region.centre.yield.own_prepared]
all = 10000
[region.centre.yield.own_fuel]
all = 10000

[modules.subsistence]
recipes = [ "own_fuel", "own_prepared", "own_staple" ]

# The closed role that only external agents fill must not subsist (spec-subsistence.md 3.2.1).
[modules.subsistence.role.visitor]
recipes = []
